services:
  startora:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      APP_ORIGIN: "http://localhost:3000"
      PORT: "3000"
      # Custom path for the SQLite database inside the container
      DATABASE_PATH: "/app/data/startora.sqlite"
    volumes:
      - startora-data:/app/data

volumes:
  startora-data:
